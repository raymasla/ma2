function mjEsc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mjBuildResultHtml(d){
  const order=d.playerOrder||[];
  const money=d.money||{};
  const delta=d.moneyDelta||{};
  const tags=(d.fanList&&d.fanList.length)?d.fanList:(d.fanDetail? d.fanDetail.split(' / '):[]);
  let html='<div class="res-box">';
  html+='<div class="res-tags">'+tags.map(t=>`<span class="fan-pill">${mjEsc(t)}</span>`).join('')+'</div>';
  html+=`<div class="res-total">總計：${d.winFan||0} 台　💵 $${(d.winPay||0).toLocaleString()}</div>`;
  if(d.winTingTxt) html+=`<div class="res-ting">🀄 ${mjEsc(d.winnerName)} 聽：<b>${mjEsc(d.winTingTxt)}</b></div>`;
  const wName=mjEsc(d.winnerName||'?');
  if(d.endType==='hu' && d.loserId){
    const lose=Math.abs(delta[d.loserId]||0), win=Math.abs(delta[d.winnerId]||0);
    html+=`<div class="res-flow"><span class="flow-p">${mjEsc(d.loserName||'?')}</span>
      <span class="flow-neg">😭 -$${lose.toLocaleString()}</span>
      <span class="flow-arrow">➡</span>
      <span class="flow-pos">😆 +$${win.toLocaleString()}</span>
      <span class="flow-p">${wName}</span></div>`;
  } else if(d.endType==='zimo'){
    order.forEach(pid=>{
      if(pid===d.winnerId) return;
      const v=Math.abs(delta[pid]||0);
      html+=`<div class="res-flow"><span class="flow-p">${mjEsc(d.users?.[pid]?.name||'?')}</span>
        <span class="flow-neg">😭 -$${v.toLocaleString()}</span>
        <span class="flow-arrow">➡</span>
        <span class="flow-pos">😆 +$${v.toLocaleString()}</span>
        <span class="flow-p">${wName}</span></div>`;
    });
  }
  const allTing=d.allPlayersTing||{};
  html+='<div class="res-bal">'+order.map(pid=>{
    const dv=delta[pid]||0;
    const cls=dv>0?'up':(dv<0?'down':'flat');
    const ids=Array.isArray(allTing[pid])?allTing[pid]:[];
    const tingHtml=ids.length
      ? `<span class="bal-ting"><span class="bal-ting-label">聽</span>`
        + ids.map(id=>{
            const t=MJ_TILE_MAP[id];
            return `<div class="mjt-sm ${t?.suit||''}">${mjEsc(t?.disp||id)}</div>`;
          }).join('') + '</span>'
      : '<span class="bal-ting"></span>';
    return `<div class="bal-row"><span class="bal-name">${mjEsc(d.users?.[pid]?.name||'?')}</span>
      <span class="delta ${cls}">${dv>0?'+':(dv<0?'-':'')}$${Math.abs(dv).toLocaleString()}</span>
      ${tingHtml}
      <span class="bal-sub">餘額 $${(money[pid]??3000).toLocaleString()}</span></div>`;
  }).join('')+'</div>';
  html+='</div>';
  return html;
}

window.doRestart=()=>{
  closeWinOverlay();
  lastWinKey='';
  b2Sel=[];mjSel=-1;
  if(currentType==='big2') b2Start();
  else                       mjStart();
};

/* ============================================================
   聊天
============================================================ */
function renderChat(chat){
  if(!chat) return;
  const el=document.getElementById('chat-msgs');
  el.innerHTML='';
  Object.values(chat).sort((a,b)=>(a.time||0)-(b.time||0)).forEach(m=>{
    if(!m?.text) return;
    const d=document.createElement('div');
    const b=document.createElement('b');
    b.textContent=(m.user||'?')+':';
    d.appendChild(b);
    d.appendChild(document.createTextNode(' '));
    const span=document.createElement('span');
    span.textContent=m.text;
    d.appendChild(span);
    el.appendChild(d);
  });
  el.scrollTop=el.scrollHeight;
}

window.sendMsg = () => {
  const inp=document.getElementById('chatInput');
  if(!inp.value.trim()||!currentRoomId) return;
  push(ref(db,`${DB[currentType]}/${currentRoomId}/chat`),{
    user:myName,text:inp.value.trim(),time:Date.now()
  });
  inp.value='';
};

window.editName = () => {
  const n=prompt('請輸入新暱稱:',myName);
  if(!n?.trim()) return;
  myName=n.trim();
  localStorage.setItem('playerName',myName);
  document.getElementById('myName').textContent=myName;
  if(currentRoomId&&currentKey)
    update(ref(db,`${DB[currentType]}/${currentRoomId}/users/${currentKey}`),{name:myName});
};

/* ============================================================
   通用輔助
============================================================ */
window.showSec = id => {
  document.querySelectorAll('.container').forEach(c=>c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
};
